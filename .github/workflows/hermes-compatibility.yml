name: Servant contracts

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * *'

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Exercise API rollouts against the pinned, older worker source.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --prefix app --ignore-scripts
      - run: npm test --prefix server

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --prefix app --ignore-scripts
      - run: npm test --prefix app
      - run: python3 scripts/test-ios-share-release.py
      - run: python3 scripts/test-agent-capabilities.py
      - run: npx --prefix app tsc --noEmit --project app/tsconfig.json
      - run: npm run lint --prefix app

  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --prefix app --ignore-scripts
      - run: npm ci --prefix relay
      - run: npm test --prefix relay

  versions:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: matrix
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python {0}
        run: |
          import json, os, pathlib, urllib.request
          versions = json.loads(pathlib.Path('config/hermes-versions.json').read_text())
          request = urllib.request.Request(
              'https://api.github.com/repos/NousResearch/hermes-agent/releases/latest',
              headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
          with urllib.request.urlopen(request, timeout=30) as response:
              latest = json.load(response)['tag_name']
          minimum = versions['minimum']
          matrix = {'include': [
              {'label': 'minimum ' + minimum['tag'], 'ref': minimum['commit'], 'python': '3.11'},
              {'label': 'latest ' + latest, 'ref': latest, 'python': '3.14'}]}
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('matrix=' + json.dumps(matrix) + '\n')
          if latest not in {item['tag'] for item in versions['tested']}:
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  summary.write('Latest Hermes is not yet recorded as tested. Add its exact commit after this matrix passes.\n')

  hermes:
    needs: versions
    name: Hermes (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.versions.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ matrix.ref }}
          path: vendor/hermes
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install the minimum Hermes source checkout
        if: matrix.python == '3.11'
        run: python -m pip install -e './vendor/hermes[messaging]'
      # Current Hermes requires Python 3.14 and its locked uv dependency
      # overrides. Plain pip cannot resolve its intentional security overrides.
      - name: Install uv for current Hermes
        if: matrix.python == '3.14'
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          version: '0.12.13'
      - name: Install current Hermes from its lockfile
        if: matrix.python == '3.14'
        working-directory: vendor/hermes
        run: |
          uv sync --locked --python 3.14 --extra messaging
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Exercise the real API, memory controls, media, stop and approvals
        run: python scripts/test-hermes-compat.py vendor/hermes
