<!--
  Servant app icon: the editable source. Each part is its own layer (a named id), bottom to top:
    field          navy background gradient
    ball-shadow    soft shadow under the ball
    ball           yellow-green ball with its highlight at the upper left (gradient stops)
    seam-groove    dark green shade just below and right of the seam, so the ball reads round (like the tennis ball emoji)
    seam           the white S
  The seam layers are drawn in a 100-unit box (the ball is the circle at 50,50 radius 50), like ServeLoader.tsx.
  Colours match SERVANT_BALL in app/src/lib/theme-colors.ts.

  After editing:  node scripts/render-icon.mjs && python3 scripts/make-icons.py
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
<defs>
  <radialGradient id="field-gradient" gradientUnits="userSpaceOnUse" cx="512" cy="420" r="800">
    <stop offset="0" stop-color="#303E8F"/><stop offset="1" stop-color="#12183F"/>
  </radialGradient>
  <radialGradient id="ball-shadow-gradient" gradientUnits="userSpaceOnUse" cx="512" cy="562" r="420">
    <stop offset="0" stop-color="#000" stop-opacity="0.5"/><stop offset="0.6" stop-color="#000" stop-opacity="0.38"/><stop offset="0.72" stop-color="#000" stop-opacity="0.2"/><stop offset="0.86" stop-color="#000" stop-opacity="0.05"/><stop offset="1" stop-color="#000" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="ball-gradient" gradientUnits="userSpaceOnUse" cx="410" cy="380" r="482">
    <stop offset="0" stop-color="#F5FE91"/><stop offset="0.166" stop-color="#EEFA7F"/><stop offset="0.334" stop-color="#E7F469"/><stop offset="0.5" stop-color="#DFEF53"/><stop offset="0.666" stop-color="#D4E646"/><stop offset="0.834" stop-color="#C8DC3C"/><stop offset="1" stop-color="#BDD332"/>
  </radialGradient>
  <clipPath id="ball-clip"><circle cx="50" cy="50" r="50"/></clipPath>
</defs>
<rect id="field" width="1024" height="1024" fill="url(#field-gradient)"/>
<circle id="ball-shadow" cx="512" cy="562" r="420" fill="url(#ball-shadow-gradient)"/>
<circle id="ball" cx="511.5" cy="511.5" r="320" fill="url(#ball-gradient)"/>
<g id="seam-layers" transform="translate(191.5 191.5) scale(6.4)">
  <g id="seam-groove" clip-path="url(#ball-clip)">
    <path d="M94.2 20 C79 5.4 52.8 5.1 43.4 19 C36.2 29.9 44 42.6 50 50 C56 57.4 63.8 70.1 56.6 81 C47.2 94.9 21 94.6 5.8 80" transform="translate(1.2 1.6)" fill="none" stroke="#5E7F12" stroke-opacity="0.5" stroke-width="7.3" stroke-linecap="round"/>
  </g>
  <path id="seam" d="M94.2 20 C79 5.4 52.8 5.1 43.4 19 C36.2 29.9 44 42.6 50 50 C56 57.4 63.8 70.1 56.6 81 C47.2 94.9 21 94.6 5.8 80" fill="none" stroke="#FFFFFF" stroke-width="7.3" stroke-linecap="round" clip-path="url(#ball-clip)"/>
</g>
</svg>