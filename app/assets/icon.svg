<!--
  Servant app icon: the editable source. Each part is its own layer (a named id), bottom to top:
    field          navy background gradient
    ball-shadow    soft shadow under the ball
    ball           white ball, lit from the upper left and a little cooler toward its lower right (gradient stops)
    seam           the S, in the field's own navy: the same gradient as the field, so it reads as cut through the ball
  The seam is drawn in a 100-unit box (the ball is the circle at 50,50 radius 50), and ServeLoader.tsx draws the same path.
  It is two arcs of one radius (27) that meet at the ball's middle, as in a yin-yang, turned 45 degrees so it reads as
  an S. The radius is a little over a quarter of the ball, so each end runs off the ball's edge, as a tennis ball's seam does.

  After editing:  node scripts/render-icon.mjs && python3 scripts/make-icons.py
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
<defs>
  <radialGradient id="field-gradient" gradientUnits="userSpaceOnUse" cx="512" cy="420" r="800">
    <stop offset="0" stop-color="#303E8F"/><stop offset="1" stop-color="#12183F"/>
  </radialGradient>
  <radialGradient id="ball-shadow-gradient" gradientUnits="userSpaceOnUse" cx="512" cy="562" r="420">
    <stop offset="0" stop-color="#000" stop-opacity="0.5"/><stop offset="0.6" stop-color="#000" stop-opacity="0.38"/><stop offset="0.72" stop-color="#000" stop-opacity="0.2"/><stop offset="0.86" stop-color="#000" stop-opacity="0.05"/><stop offset="1" stop-color="#000" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="ball-gradient" gradientUnits="userSpaceOnUse" cx="410" cy="380" r="482">
    <stop offset="0" stop-color="#FFFFFF"/><stop offset="0.5" stop-color="#FFFFFF"/><stop offset="0.8" stop-color="#F1F4FA"/><stop offset="1" stop-color="#E1E7F2"/>
  </radialGradient>
  <!-- The field's gradient again, in the seam's 100-unit box: (512, 420) and 800 through translate(191.5 191.5) scale(6.4). -->
  <radialGradient id="seam-gradient" gradientUnits="userSpaceOnUse" cx="50.078" cy="35.703" r="125">
    <stop offset="0" stop-color="#303E8F"/><stop offset="1" stop-color="#12183F"/>
  </radialGradient>
  <clipPath id="ball-clip"><circle cx="50" cy="50" r="50"/></clipPath>
</defs>
<rect id="field" width="1024" height="1024" fill="url(#field-gradient)"/>
<circle id="ball-shadow" cx="512" cy="562" r="420" fill="url(#ball-shadow-gradient)"/>
<circle id="ball" cx="511.5" cy="511.5" r="320" fill="url(#ball-gradient)"/>
<g id="seam-layers" transform="translate(191.5 191.5) scale(6.4)">
  <path id="seam" d="M88.18 11.82 A27 27 0 0 0 50 50 A27 27 0 0 1 11.82 88.18" fill="none" stroke="url(#seam-gradient)" stroke-width="8" stroke-linecap="round" clip-path="url(#ball-clip)"/>
</g>
</svg>